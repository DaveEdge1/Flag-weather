project:
  type: website
  output-dir: _site
  resources:
    - "events/frames/**"

website:
  title: "Flag weather retrospective"
  description: "Storm events and monthly climate synopses for Flagstaff, Arizona"
  site-url: https://daveedge1.github.io/Flag-weather/
  repo-url: https://github.com/DaveEdge1/Flag-weather
  repo-actions: [issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: events/index.qmd
        text: Events
      - href: monthly/index.qmd
        text: Monthly
      - href: pacific.qmd
        text: Pacific
      - href: network.qmd
        text: Network
      - href: methods.qmd
        text: Methods
      - href: glossary.qmd
        text: Glossary
  page-footer:
    center: "Data: City of Flagstaff ALERT network · NRCS SNOTEL · NWS/RCC-ACIS · ERA5 (Copernicus) · NHC"

filters:
  - glossary.lua

format:
  html:
    include-after-body: [_glossary-tooltips.html, _player.html]
    theme:
      light: cosmo
      dark: darkly
    toc: true
    fig-format: png
    fig-dpi: 130

execute:
  echo: false
  warning: false
  freeze: auto
