# Site glossary. Each entry: id (anchor on glossary.html), term (heading), def (tooltip and glossary text),
# aliases (phrases linked on first mention per page; matching ignores case and surrounding punctuation).
terms:
  - id: alert
    term: ALERT gauge network
    def: "Automated Local Evaluation in Real Time: flood-warning rain gauges operated by the City of Flagstaff and Coconino County. Each gauge is a 1-mm tipping bucket that reports every tip by radio."
    aliases: [ALERT]
  - id: tipping-bucket
    term: Tipping bucket
    def: "A rain gauge that funnels rain into a small two-sided bucket that tips each time it fills (1 mm here). Tips are counted and time-stamped; very intense rain can be undercounted and snow is not measured until it melts."
    aliases: [tipping bucket, tipping buckets]
  - id: network-median
    term: Network median and percentiles
    def: "Statistics across all gauges in the network. The median is the middle gauge value; the 10th–90th percentile range spans the middle 80% of gauges, so a single gauge does not stand in for the city."
    aliases: [network median, 10th–90th percentile]
  - id: network-mean
    term: Network-mean rain
    def: "The average of all gauges' hourly rain. Used to time an event: the 'central 80%' is the period between 10% and 90% of the network-mean total."
    aliases: [network-mean, network mean]
  - id: event-window
    term: Event window
    def: "The UTC period chosen to contain an event's rain. Gauge totals are summed over it; airport and SNOTEL values use the local (MST) calendar days it covers."
    aliases: [event window]
  - id: provisional
    term: Provisional and final pages
    def: "An event page is provisional until ERA5 covers the whole event window (about 5 days after it ends); it is then rebuilt with ERA5 maps and the atmospheric summary and marked final."
    aliases: []
  - id: snotel
    term: SNOTEL
    def: "Snow Telemetry: automated USDA NRCS mountain stations measuring snow water equivalent, snow depth, accumulated precipitation and air temperature. Sites used here: Fort Valley, Snowslide Canyon and Fry."
    aliases: [SNOTEL]
  - id: swe
    term: Snow water equivalent (SWE)
    def: "The depth of water that would result if the snowpack melted, in inches."
    aliases: [snow water equivalent, SWE]
  - id: water-year
    term: Water year
    def: "October 1 to September 30, named for the calendar year in which it ends (water year 2027 began October 1, 2026)."
    aliases: [water year, water-year]
  - id: normals
    term: 1991–2020 normals and medians
    def: "NOAA's 30-year average for each calendar day at the Flagstaff airport (1991–2020 Climate Normals). SNOTEL comparisons use the NRCS 1991–2020 median for the date."
    aliases: [1991–2020 normal, 1991–2020 normals]
  - id: mst
    term: MST and UTC
    def: "Mountain Standard Time is UTC−7. Arizona does not observe daylight saving time, so Flagstaff is on MST all year. ERA5 and maps use UTC (Coordinated Universal Time)."
    aliases: [MST, UTC]
  - id: era5
    term: ERA5
    def: "The fifth-generation ECMWF global atmospheric reanalysis from the Copernicus Climate Change Service: a consistent reconstruction of past weather from 1940 on, combining observations with a forecast model. Used here at 0.25° and 6-hourly; it becomes available about 5 days after real time."
    aliases: [ERA5]
  - id: ivt
    term: Integrated vapour transport (IVT)
    def: "The horizontal flux of water vapour summed through the depth of the atmosphere, in kg m⁻¹ s⁻¹: how much moisture the wind carries across each metre of a line on the ground, per second."
    aliases: [IVT, integrated vapour transport]
  - id: atmospheric-river
    term: Atmospheric river
    def: "A long, narrow corridor of strong water-vapour transport. On this site, 'atmospheric-river strength' means IVT ≥ 250 kg m⁻¹ s⁻¹, a threshold widely used for western North America (e.g. Rutz et al. 2014)."
    aliases: [atmospheric river, atmospheric rivers, atmospheric-river]
  - id: tcwv
    term: Total column water vapour
    def: "The mass of water vapour above a unit area from the ground to the top of the atmosphere, in mm (kg m⁻²); also called precipitable water."
    aliases: [total column water vapour]
  - id: z500
    term: 500-hPa height
    def: "The altitude of the 500-hPa pressure surface (hPa = hectopascal = millibar), about 5.5–6 km above sea level. Low heights mark troughs and lows aloft, and the wind at this level blows nearly along the height contours."
    aliases: [500-hPa height, 500-hPa heights, 500-hPa]
  - id: trough-axis
    term: Trough axis
    def: "The line through the lowest heights of an elongated region of low 500-hPa height. Here: the longitude of the lowest 500-hPa height along Flagstaff's latitude between 135°W and Flagstaff."
    aliases: [trough axis]
  - id: closed-low
    term: Closed low
    def: "A low aloft enclosed by at least one height contour. Here: a local minimum of 500-hPa height over a 5° neighbourhood within 1,500 km of Flagstaff."
    aliases: [closed 500-hPa low, closed low]
  - id: jet
    term: 250-hPa wind and the jet stream
    def: "Wind speed at the 250-hPa level, about 10–11 km above sea level, near the level of the jet stream (a narrow band of strong westerly wind). Maps contour 40, 55 and 70 m s⁻¹."
    aliases: [250-hPa wind, 250-hPa, jet stream]
  - id: tropical-cyclone
    term: Tropical cyclone
    def: "A warm-core low-pressure system that forms over tropical oceans. NHC categories: tropical depression (sustained wind < 34 kt), tropical storm (34–63 kt), hurricane (≥ 64 kt)."
    aliases: [tropical cyclone, tropical cyclones, tropical storm, hurricane]
  - id: remnant
    term: Remnant disturbance / remnant low
    def: "What is left of a tropical cyclone after it loses its tropical structure; NHC continues to track it as a disturbance (DB) or low (LO). Its moisture can still reach Arizona."
    aliases: [remnant disturbance, remnant low]
  - id: best-track
    term: NHC best track
    def: "The National Hurricane Center's record of each storm's position and intensity every 6 hours. This site uses the operational files; the final best track is released after the season and may differ slightly."
    aliases: [best track, best-track, NHC best track]
  - id: shaded-relief
    term: Shaded relief, 3DEP and NHD
    def: "Gauge maps show terrain as shaded relief computed from the USGS 3D Elevation Program (3DEP) digital elevation model, with 200-m contours, streams from the USGS National Hydrography Dataset (NHD) and highways from Census TIGER."
    aliases: [shaded relief, USGS 3DEP, USGS NHD]
  - id: enso
    term: El Niño–Southern Oscillation (ENSO)
    def: "The coupled ocean–atmosphere cycle of the tropical Pacific. El Niño is its warm phase (above-normal sea-surface temperature in the central and eastern equatorial Pacific); La Niña is its cool phase."
    aliases: [El Niño, La Niña, ENSO]
  - id: oni
    term: Oceanic Niño Index (ONI) and Niño3.4
    def: "Niño3.4 is the sea-surface temperature anomaly averaged over 5°S–5°N, 170°W–120°W. NOAA's ONI is its 3-month running mean; NOAA calls an El Niño weak at ≥ 0.5 °C, moderate ≥ 1.0, strong ≥ 1.5 and very strong ≥ 2.0."
    aliases: [ONI, Niño3.4, Oceanic Niño Index]
  - id: pdo
    term: Pacific Decadal Oscillation (PDO)
    def: "The leading pattern of North Pacific (north of 20°N) sea-surface temperature variability. Positive PDO: cool central North Pacific and warm water along the North American coast; negative PDO: the reverse."
    aliases: [PDO, Pacific Decadal Oscillation]
  - id: pna
    term: Pacific–North American pattern (PNA)
    def: "A pattern of 500-hPa height anomalies over the North Pacific and North America. Positive PNA: low heights near the Aleutians and southeastern US, high heights over western Canada; negative PNA: the reverse, with a trough over the western US."
    aliases: [PNA, Pacific–North American pattern]
  - id: aleutian-low
    term: Aleutian Low
    def: "The semi-permanent area of low sea-level pressure over the North Pacific near the Aleutian Islands, strongest in winter. Here its centre is the lowest monthly mean sea-level pressure over 30–65°N, 150°E–130°W."
    aliases: [Aleutian Low]
  - id: npi
    term: North Pacific Index (NPI)
    def: "Area-weighted mean sea-level pressure over 30–65°N, 160°E–140°W (Trenberth and Hurrell 1994); a measure of Aleutian Low strength. Lower values mean a deeper Aleutian Low."
    aliases: [North Pacific Index, NPI]
  - id: nph
    term: North Pacific High
    def: "The semi-permanent subtropical high-pressure area over the northeastern Pacific, strongest and farthest north in summer. Here its centre is the highest monthly mean sea-level pressure over 15–50°N, 180–120°W."
    aliases: [North Pacific High]
  - id: sst
    term: Sea-surface temperature (SST) anomaly
    def: "Departure of ocean surface temperature from its 1991–2020 mean for the same calendar month. This site uses NOAA ERSSTv5 (2° monthly reconstruction)."
    aliases: [SST anomaly, SST anomalies, ERSSTv5, SST]
  - id: teleconnection
    term: Teleconnection
    def: "A statistical and physical link between climate conditions in widely separated regions, such as between tropical Pacific sea-surface temperature and Southwest US winter precipitation."
    aliases: [teleconnection, teleconnections]
  - id: analog
    term: Analog years and pattern correlation
    def: "Analog years are past years with a similar state (here Nov–Jan ONI ≥ 1.5 °C). Pattern correlation is the area-weighted correlation between two anomaly maps; +1 means identical patterns, 0 unrelated."
    aliases: [analog years, analog, pattern correlation]
  - id: npj
    term: North Pacific jet (NPJ) and the subtropical jet
    def: "The North Pacific jet is the band of strongest upper-level westerly wind leaving East Asia over the North Pacific. Its eastern end, the exit region, extends or retracts and shifts north or south from week to week. The subtropical jet is a lower-latitude branch; when it is displaced south and strengthened toward Baja California, storms are steered toward the Southwest."
    aliases: [North Pacific jet, North Pacific Jet, NPJ, subtropical jet]
  - id: eof
    term: EOF and principal component (PC)
    def: "Empirical orthogonal function analysis finds the spatial patterns that account for the most variance in a field. Each pattern (EOF) has a time series, its principal component, giving how strongly the pattern is present each month."
    aliases: [EOF, EOFs, principal component, principal components]
  - id: npj-phase
    term: NPJ phase diagram
    def: "A plot of the first two principal components of North Pacific 250-hPa zonal wind (Winters et al. 2019): PC1 measures jet extension (+) or retraction (−), PC2 a poleward (+) or equatorward (−) shift of the jet exit region."
    aliases: [phase diagram, NPJ phase diagram]
  - id: p2
    term: Athanasiadis P2 pattern
    def: "The second pattern of Pacific winter 250-hPa zonal wind variability in Athanasiadis, Wallace and Wettstein (2010). Its positive phase (as signed here) strengthens westerlies near 20–30°N toward Baja California and weakens them near 40°N, shifting the West Coast precipitation belt south. ENSO projects onto it."
    aliases: [Athanasiadis P2, P2]
  - id: sw-trough
    term: Southwest trough index
    def: "Nov–Mar mean 500-hPa height anomaly over 31–41°N, 129–114°W, just off California: the location most strongly correlated with Flagstaff winter precipitation. Negative values mean lower heights (troughing) upstream of Arizona."
    aliases: [Southwest trough]
  - id: afd
    term: Area Forecast Discussion (AFD)
    def: "A technical discussion issued several times a day by each National Weather Service forecast office explaining the reasoning behind its forecast. Excerpts on this site come from the Flagstaff office (AFDFGZ), via the Iowa Environmental Mesonet archive."
    aliases: [Area Forecast Discussion, Area Forecast Discussions, AFD]
  - id: pwat
    term: Precipitable water (PWAT)
    def: "The total water vapour in a column of the atmosphere, expressed as the depth of liquid water (in inches or mm) if it all condensed. Equivalent to ERA5 total column water vapour."
    aliases: [PWAT, PWATs, precipitable water]
